name: Deploy Cuộc Đại Thanh Lọc to GitHub Pages

on:
  # Tự động chạy mỗi khi có lệnh push lên nhánh main (hoặc master)
  push:
    branches: ["main"]

  # Cho phép bạn bấm nút chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:

# Phân quyền cần thiết cho GitHub Actions để tương tác với GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Đảm bảo chỉ có một tiến trình deploy chạy tại một thời điểm
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cấu hình môi trường GitHub Pages
        uses: actions/configure-pages@v4

      - name: Tải file lên artifact (Toàn bộ thư mục gốc chứa index.html)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Triển khai lên GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
